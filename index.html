<!DOCTYPE html>
<html lang="pt-BR" data-pal="nude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7d3326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Perfil 40+">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Portal Perfil 40+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: acolhedor e elegante, de mulher para mulher
   IDEA: um caderno de produção do Instituto Perfil 40+, com etapas que ela acompanha
   PICTURE: a esteira de produção e o painel do Instagram no topo
   COLOUR and TYPE: creme, vinho, dourado e rosa suave; Cormorant Garamond + Great Vibes + Inter
   LAYOUT: barra lateral vinho no computador, abas embaixo no celular */
:root{color-scheme:light dark;
--bg:light-dark(#faf5ec,#1a1013);--card:light-dark(#fffdf9,#251719);--ink:light-dark(#2b1a1e,#f4e9e3);
--mute:light-dark(#7a6468,#bda8aa);--line:light-dark(#ecdfcf,#3b272b);--brand:light-dark(#7a1f3d,#e7a3b5);
--brand2:light-dark(#f6e4e6,#3a2029);--acc:light-dark(#9c7128,#d9b26a);--accs:light-dark(#f6ecd8,#3a2d18);--onbrand:light-dark(#fff,#1a1013);--side:#6e1b37;--gold:#e6c27a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,4.6vw,44px)}h2{font-size:25px}h3{font-size:19px}
.cur{font-family:"Great Vibes",cursive;font-weight:400;color:var(--acc);font-size:1.15em}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--onbrand);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;margin:0 8px 22px}
.logo b{font-family:"Cormorant Garamond",serif;font-size:21px;line-height:1.1}.logo small{display:block;font-family:"Great Vibes",cursive;font-size:19px;color:var(--gold)}
.nav a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;min-height:44px}
.nav a[aria-current]{background:color-mix(in srgb,currentColor 14%,transparent)}
.nav svg{width:20px;height:20px;flex:none}
.side .who{margin-top:auto;font-size:13px;opacity:.85;padding:0 8px}
main{padding:clamp(20px,3vw,40px) max(4vw,16px) 100px;max-width:1180px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.sub{color:var(--mute);margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;background:var(--brand);color:var(--onbrand)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.hot{background:var(--acc);color:light-dark(#fff,#1a1013)}
.btn.wa{background:#1fa855;color:#fff}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;min-height:38px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--brand2);color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px 0 24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font:700 clamp(30px,4.4vw,40px)/1.05 "Cormorant Garamond",serif}.kpi span{color:var(--mute);font-size:14px}
.belt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stage{background:var(--brand2);border-radius:12px;padding:12px 10px;min-height:150px;position:relative}
.stage h3{font-size:13px;color:var(--brand);margin-bottom:8px;display:flex;justify-content:space-between}
.chip{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px;margin-bottom:6px;line-height:1.3}
.stage.warn{background:var(--accs)}.stage.warn h3{color:var(--acc)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;text-align:left}
.thumb{width:64px;height:64px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.thumb svg{width:22px;height:22px}
.item .t{font-weight:600}.item .m{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--brand2);color:var(--brand)}
.tag.aprovacao,.tag.ajuste,.tag.escrito{background:var(--accs);color:var(--acc)}
.tag.publicado,.tag.aprovado{background:var(--brand);color:var(--onbrand)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:500}
.filters button[aria-pressed=true]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
dialog{border:0;border-radius:18px;padding:0;width:min(640px,100% - 24px);max-height:calc(100vh - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(8,20,18,.55)}
.dlg{padding:22px}.dlg header{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}
.x{border:0;background:var(--bg);border-radius:10px;width:44px;height:44px;font-size:22px;flex:none}
.player{aspect-ratio:9/16;max-height:340px;margin:0 auto 14px;border-radius:14px;display:grid;place-items:center;color:#fff;text-align:center;padding:16px;font-size:14px}
.steps{display:flex;gap:4px;margin:10px 0 16px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
.com{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:8px 0;font-size:15px}.com small{color:var(--mute);display:block}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.note{font-size:13px;color:var(--mute);margin-top:28px}
.bell{position:relative}.bell em{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#fff;font-style:normal;font-size:12px;border-radius:999px;padding:1px 6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.week{margin-bottom:20px}.week h3{color:var(--mute);font-size:14px;margin-bottom:8px}
.day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.day b{font:700 26px/1 "Cormorant Garamond",serif;color:var(--brand);text-align:center}.day b small{display:block;font:500 12px Inter;color:var(--mute)}
pre.rot{white-space:pre-wrap;font:15px/1.6 Inter;background:var(--bg);border-radius:12px;padding:14px;margin:0}
:root[data-pal=rose]{--bg:light-dark(#fbf0ef,#1c1114);--card:light-dark(#fffafa,#28181c);--ink:light-dark(#3a1d26,#f6e8e8);--mute:light-dark(#8a6670,#c4a7ad);--line:light-dark(#f0d9da,#40282e);--brand:light-dark(#9b2c52,#f0a8bf);--brand2:light-dark(#fbe1e7,#46232f);--acc:light-dark(#a8744a,#e5b98f);--accs:light-dark(#f8e6d8,#3d2a1d);--side:#8e2549;--gold:#f3cfa6}
:root[data-pal=noite]{color-scheme:dark;--bg:#1b0d13;--card:#26141b;--ink:#f6ece4;--mute:#c4aab0;--line:#3d232c;--brand:#e3b766;--brand2:#3a1f28;--acc:#e3b766;--accs:#3d2e17;--onbrand:#1b0d13;--side:#12080c;--gold:#e3b766}
:root[data-pal=nude]{--bg:light-dark(#f5ede4,#1b1310);--card:light-dark(#fffaf4,#271c17);--ink:light-dark(#3b2620,#f2e6dc);--mute:light-dark(#86706a,#bfaa9f);--line:light-dark(#e6d6c6,#3d2c24);--brand:light-dark(#8a3b2e,#eba48f);--brand2:light-dark(#f2dfd3,#40261e);--acc:light-dark(#9a6a2c,#dcb06b);--accs:light-dark(#f2e4cc,#3b2c17);--side:#7d3326;--gold:#ecc58a}
:root[data-pal=branco]{--bg:light-dark(#ffffff,#141012);--card:light-dark(#fcf8f6,#1f191b);--ink:light-dark(#231417,#f3ecea);--mute:light-dark(#72636a,#b3a6aa);--line:light-dark(#efe5e2,#33292c);--brand:light-dark(#6e1b37,#e7a3b5);--brand2:light-dark(#f8ecee,#33212a);--acc:light-dark(#b08a3e,#dcb86e);--accs:light-dark(#f7efdf,#382d19);--side:light-dark(#fcf8f6,#1f191b);--gold:#b08a3e;--sideink:light-dark(#3b2026,#f3ecea)}
.side{color:var(--sideink,#fff)}
.palbtn{position:fixed;right:16px;bottom:16px;z-index:6;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;box-shadow:0 6px 20px rgba(40,10,20,.18);display:flex;gap:8px;align-items:center}
.palbtn i{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--side) 0 33%,var(--acc) 0 66%,var(--brand2) 0)}
.pals{display:grid;gap:10px}.pal{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px;text-align:left;width:100%}
.pal[aria-pressed=true]{border-color:var(--acc)}.pal .sw{display:flex;height:48px;border-radius:9px;overflow:hidden}.pal .sw span{flex:1}
.pal b{font-family:"Cormorant Garamond",serif;font-size:21px;display:block;line-height:1.1}.pal small{color:var(--mute);font-size:14px}
@media(max-width:700px){.palbtn{bottom:86px}}
@media(max-width:860px){.belt{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
 .logo,.side .who{display:none}.nav{display:flex;width:100%;justify-content:space-around}
 .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;text-align:center;align-items:center}
 .belt{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{min-height:auto}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
 <aside class="side">

  <nav class="nav" id="nav"></nav>

 </aside>
 <main id="main"></main>
</div>

<script>
{
const ic={
painel:'<path d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-5H4zm10-11h6V4h-6z" fill="currentColor"/>',
videos:'<path d="M4 6h11v12H4zm12 4l4-3v10l-4-3z" fill="currentColor"/>',
roteiros:'<path d="M6 3h9l4 4v14H6zm3 7h7v2H9zm0 4h7v2H9z" fill="currentColor"/>',
calendario:'<path d="M5 6h14v14H5zm0 4h14M9 3v5m6-5v5" stroke="currentColor" stroke-width="2" fill="none"/>',
drive:'<path d="M8 3h8l6 11-4 7H6l-4-7z M8 3l6 11H2 M16 3l-6 11 4 7 M22 14H10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>',
marca:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15.5 15H18a3 3 0 0 0 3-3c0-5-4-9-9-9z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.5" cy="11" r="1.3" fill="currentColor"/><circle cx="11" cy="7.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/>',
ajustes:'<circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8l3 3M5 19l3-3m8-8l3-3" stroke="currentColor" stroke-width="2"/>'};
const views=[['painel','Painel'],['videos','Vídeos'],['drive','Drive'],['roteiros','Roteiros'],['calendario','Agenda'],['marca','Artes'],['ajustes','Ajustes']];
const ST=[['recebido','Material recebido'],['edicao','Em edição'],['aprovacao','Aguardando aprovação'],['ajuste','Ajuste pedido'],['aprovado','Aprovado'],['publicado','Publicado']];
const stName=s=>(ST.find(x=>x[0]==s)||[0,s])[1];
const RS={briefing:'Briefing enviado',escrito:'Roteiro para aprovar',aprovado:'Roteiro aprovado'};
const cores=['#7a1f3d','#a87a2e','#c98b9b','#5a1530','#8c5a3c','#b2546e'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{if(!d)return'—';const[y,m,da]=d.split('-');return da+'/'+m};
const hoje='2026-11-22';
const seed=()=>({cfg:{nome:'Instituto Perfil 40+',whats:'5571999999999',editor:'Você (editor)'},
videos:[
{id:1,titulo:'Recomeçar aos 40 não é voltar atrás',tipo:'Reels',status:'aprovacao',prazo:'2026-11-24',post:'2026-11-26',drive:'https://drive.google.com/',versao:2,coments:[{a:'Instituto',t:'Pode deixar a palavra recomeçar em dourado no gancho?',q:'20/11'},{a:'Editor',t:'Feito! Versão 2 com gancho em cursiva dourada e tela final.',q:'21/11'}],cor:0},
{id:2,titulo:'Convite: Ela Por Inteiro, 12/12 no Catussaba',tipo:'Reels',status:'edicao',prazo:'2026-11-25',post:'2026-11-27',drive:'https://drive.google.com/',versao:1,coments:[],cor:1},
{id:3,titulo:'Depoimento: de volta ao mercado aos 47',tipo:'Reels',status:'recebido',prazo:'2026-11-29',post:'2026-12-02',drive:'https://drive.google.com/',versao:0,coments:[],cor:2},
{id:4,titulo:'Bastidores da mentoria de novembro',tipo:'Reels',status:'ajuste',prazo:'2026-11-23',post:'2026-11-28',drive:'https://drive.google.com/',versao:1,coments:[{a:'Instituto',t:'Trocar a música por algo mais suave e cortar o começo.',q:'21/11'}],cor:3},
{id:5,titulo:'Vagas da semana',tipo:'Reels',status:'aprovado',prazo:'2026-11-20',post:'2026-11-23',drive:'https://drive.google.com/',versao:2,coments:[],cor:4},
{id:6,titulo:'Convite do evento no resort',tipo:'Reels',status:'publicado',prazo:'2026-11-12',post:'2026-11-14',drive:'https://drive.google.com/',versao:3,coments:[],cor:5},
{id:7,titulo:'A mulher que escolhe ser',tipo:'Reels',status:'publicado',prazo:'2026-11-06',post:'2026-11-08',drive:'https://drive.google.com/',versao:1,coments:[],cor:0}],
roteiros:[
{id:1,titulo:'Faltam 10 dias para Ela Por Inteiro',formato:'Reels 45s',objetivo:'Vender as últimas vagas da imersão',status:'escrito',data:'2026-12-02',texto:'GANCHO (0–2s): Fundadora olhando para a câmera. Texto: "Você ainda está esperando a hora certa?" (palavra "hora" em cursiva dourada)\nCENA 2 (2–20s): "Dia 12 de dezembro, no Catussaba, vamos passar um dia inteiro cuidando da mulher que você escolhe ser."\nCENA 3 (20–40s): Cortes rápidos do último evento: abraços, anotações, risadas.\nCHAMADA (40–45s): "As vagas estão acabando. Garanta a sua no link da bio."\nTELA FINAL (3s): logo, @institutoperfil40, "Garanta sua vaga – link na bio".'},
{id:2,titulo:'Por que contratar uma mulher 40+',formato:'Reels 60s',objetivo:'Atrair empresas parceiras para as vagas',status:'briefing',data:'2026-12-10',texto:''},
{id:3,titulo:'Depoimento de mentorada',formato:'Reels 40s',objetivo:'Gerar confiança nas mentorias',status:'aprovado',data:'2026-11-30',texto:'GANCHO: "Aos 45 eu achei que ninguém ia me contratar."\nHistória dela em até 30s, com legenda palavra por palavra.\nCHAMADA: "Sua vez de recomeçar. Conheça as mentorias no link da bio."'}],
drive:{conectado:false,conta:'',entrada:[
{id:1,nome:'IMG_4821.MOV',tam:'312 MB',q:'21/11',por:'Fundadora',pedido:3},
{id:2,nome:'catussaba-visita.MOV',tam:'284 MB',q:'21/11',por:'Fundadora',pedido:2},
{id:3,nome:'depoimento-mentorada.mp4',tam:'540 MB',q:'22/11',por:'Fundadora',pedido:0},
{id:4,nome:'logo-perfil40.png',tam:'1 MB',q:'18/11',por:'Fundadora',pedido:0}]},
notif:[{t:'Vídeo "Recomeçar aos 40 não é voltar atrás" está pronto para aprovação',q:'21/11'},{t:'Roteiro "Faltam 10 dias para Ela Por Inteiro" foi enviado',q:'20/11'}]});
let db;try{db=JSON.parse(localStorage.getItem('portal-p40'))}catch(e){}
if(!db||!db.videos)db=seed();
if(!db.drive)db.drive=seed().drive;
const save=()=>{try{localStorage.setItem('portal-p40',JSON.stringify(db))}catch(e){}};
let papel='inst';try{papel=localStorage.getItem('portal-papel')||'inst'}catch(e){}
let filtro='todos';
const M=document.getElementById('main'),D=document.getElementById('dlg'),DB=document.getElementById('dlgBody');
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)};
const notify=t=>{db.notif.unshift({t,q:fmt(hoje)});save()};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ic[n]}</svg>`;
const thumb=v=>`<span class="thumb" style="background:${cores[v.cor%6]}">${svg('videos')}</span>`;
const waLink=txt=>'https://wa.me/'+encodeURIComponent(db.cfg.whats)+'?text='+encodeURIComponent(txt);

function head(t,s,extra=''){return `<div class="top"><div><h1>${t}</h1>${s?`<p class="sub">${s}</p>`:''}</div><div class="row">${extra}
<div class="seg" role="group" aria-label="Ver como"><button data-papel="inst" aria-pressed="${papel=='inst'}">Instituto</button><button data-papel="ed" aria-pressed="${papel=='ed'}">Editor</button></div>
<button class="btn alt bell" data-act="notifs" aria-label="Avisos">Avisos${db.notif.length?`<em>${db.notif.length}</em>`:''}</button></div></div>`}

  if(prox)acoes=`<button class="btn" data-do="st:${prox[0]}">${prox[1]}</button>`;
  acoes+=`<a class="btn wa" style="text-decoration:none;display:inline-flex;align-items:center" href="${waLink(msg)}" target="_blank" rel="noopener">Avisar no WhatsApp</a>`}
 DB.innerHTML=`<header><div><span class="tag ${v.status}">${stName(v.status)}</span><h2 style="margin-top:8px">${esc(v.titulo)}</h2><p class="sub">${esc(v.tipo)} · versão ${v.versao||'—'} · entrega ${fmt(v.prazo)} · post ${fmt(v.post)}</p></div><button class="x" data-act="fechar" aria-label="Fechar">×</button></header>
 <div class="steps" aria-label="Etapa ${idx+1} de 6">${ST.map((s,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div>
 <div class="player" style="background:linear-gradient(160deg,${cores[v.cor%6]},#2b1a1e)"><div>${svg('videos').replace('<svg','<svg width="44" height="44"')}<br>${v.versao?'Aqui toca a versão '+v.versao+' direto do Google Drive':'Material bruto recebido. A edição ainda não começou.'}</div></div>
 <p><a href="${esc(v.drive)}" target="_blank" rel="noopener">Abrir pasta no Drive</a></p>
 <div class="row" style="margin:12px 0">${acoes}</div>
 ${papel=='ed'?`<p class="sub" style="font-size:13px">O botão abre o WhatsApp para ${esc(db.cfg.whats)} com a mensagem pronta.</p>`:''}
 <h3 style="margin-top:16px">Comentários</h3>${v.coments.map(c=>`<div class="com"><small>${esc(c.a)} · ${esc(c.q)}</small>${esc(c.t)}</div>`).join('')||'<p class="sub">Nenhum comentário ainda.</p>'}
 <form id="fCom"><label for="tCom">Escrever comentário</label><textarea id="tCom" placeholder="Ex.: aos 0:12, trocar a música"></textarea><button class="btn alt" style="margin-top:8px">Enviar comentário</button></form>`;
 DB.dataset.video=id;delete DB.dataset.rot;if(!D.open)D.showModal();
}

function abrirRot(id){
 const r=db.roteiros.find(x=>x.id==id);if(!r)return;
 let corpo=r.texto?`<pre class="rot">${esc(r.texto)}</pre>`:'<p class="sub">O editor ainda está escrevendo este roteiro.</p>';
 let acoes='';
 if(papel=='inst'&&r.status=='escrito')acoes=`<button class="btn" data-do="rAprovar">Aprovar roteiro</button>`;
 if(papel=='ed'&&r.status!='aprovado')corpo=`<label for="tRot">Roteiro</label><textarea id="tRot" style="min-height:220px">${esc(r.texto)}</textarea>`,acoes=`<button class="btn" data-do="rEnviar">Enviar para aprovação</button>`;
 DB.innerHTML=`<header><div><span class="tag ${r.status}">${RS[r.status]}</span><h2 style="margin-top:8px">${esc(r.titulo)}</h2><p class="sub">${esc(r.formato)} · para ${fmt(r.data)}<br>Objetivo: ${esc(r.objetivo)}</p></div><button class="x" data-act="fechar" aria-label="Fechar">×</button></header>${corpo}<div class="row" style="margin-top:14px">${acoes}</div>`;
 DB.dataset.rot=id;delete DB.dataset.video;if(!D.open)D.showModal();
}

function form(tipo){
 DB.innerHTML=tipo=='v'?`<header><h2>Enviar material</h2><button class="x" data-act="fechar" aria-label="Fechar">×</button></header>
 <form id="fNovo"><label for="nT">O que é o vídeo?</label><input id="nT" required placeholder="Ex.: Convite para a mentoria de janeiro">
 <label for="nF">Formato</label><select id="nF"><option>Reels</option><option>Stories</option><option>YouTube</option><option>Feed</option></select>
 <label for="nD">Link da pasta no Drive com o material</label><input id="nD" type="url" placeholder="https://drive.google.com/...">
 <label for="nP">Quando quer postar?</label><input id="nP" type="date" value="2026-12-01">
 <label for="nO">Observações</label><textarea id="nO" placeholder="Frase do gancho, trecho mais forte, o que não pode faltar"></textarea>
 <button class="btn hot" style="margin-top:14px">Enviar para o editor</button></form>`:
 `<header><h2>Pedir roteiro</h2><button class="x" data-act="fechar" aria-label="Fechar">×</button></header>
 <form id="fRot"><label for="rT">Tema</label><input id="rT" required placeholder="Ex.: 3 sinais de que é hora de recomeçar">
 <label for="rF">Formato</label><select id="rF"><option>Reels 30s</option><option>Reels 60s</option><option>Stories</option><option>YouTube</option></select>
 <label for="rO">Objetivo</label><input id="rO" placeholder="Ex.: vender vagas da imersão">
 <label for="rD">Data desejada</label><input id="rD" type="date" value="2026-12-08">
 <button class="btn hot" style="margin-top:14px">Enviar briefing</button></form>`;
 delete DB.dataset.video;delete DB.dataset.rot;if(!D.open)D.showModal();
}

document.addEventListener('click',e=>{
 const pb=e.target.closest('.pal');if(pb){setPal(pb.dataset.pal);document.querySelectorAll('.pal').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pal==pal));toast('Paleta: '+(PALS.find(x=>x[0]==pal)||PALS[0])[1]);return}
 const b=e.target.closest('[data-video],[data-rot],[data-act],[data-papel],[data-filtro],[data-do]');if(!b)return;
 if(b.dataset.do){const d=b.dataset.do;
  if(DB.dataset.video){const v=db.videos.find(x=>x.id==DB.dataset.video);
   if(d=='aprovar'){v.status='aprovado';notify(`${db.cfg.nome} aprovou "${v.titulo}"`);toast('Vídeo aprovado!')}
   else if(d=='ajuste'){const t=document.getElementById('tCom');if(!t.value.trim()){t.focus();toast('Escreva o ajuste no comentário');return}
    v.coments.push({a:'Instituto',t:t.value.trim(),q:fmt(hoje)});v.status='ajuste';notify(`Ajuste pedido em "${v.titulo}"`);toast('Pedido de ajuste enviado')}
   else if(d.startsWith('st:')){const s=d.slice(3);if(s=='aprovacao')v.versao=(v.versao||0)+1;v.status=s;notify(`"${v.titulo}": ${stName(s)}`);toast('Status atualizado')}
   save();render();abrirVideo(v.id);return}
  if(DB.dataset.rot){const r=db.roteiros.find(x=>x.id==DB.dataset.rot);
   if(d=='rAprovar'){r.status='aprovado';notify(`Roteiro "${r.titulo}" aprovado`);toast('Roteiro aprovado!')}
   if(d=='rEnviar'){const t=document.getElementById('tRot').value.trim();if(!t){toast('Escreva o roteiro primeiro');return}r.texto=t;r.status='escrito';notify(`Roteiro "${r.titulo}" pronto para aprovação`);toast('Roteiro enviado')}
   save();render();abrirRot(r.id);return}}
 if(b.dataset.video){e.preventDefault();abrirVideo(b.dataset.video);return}
 if(b.dataset.rot){e.preventDefault();abrirRot(b.dataset.rot);return}
 if(b.dataset.papel){papel=b.dataset.papel;try{localStorage.setItem('portal-papel',papel)}catch(x){}render();toast(papel=='inst'?'Vendo como o instituto':'Vendo como editor');return}
 if(b.dataset.filtro){filtro=b.dataset.filtro;render();return}
 const a=b.dataset.act;
 if(a=='cores'){DB.innerHTML=`<header><div><h2>Escolha as cores</h2><p class="sub">Toque numa paleta para ver o portal inteiro com ela.</p></div><button class="x" data-act="fechar" aria-label="Fechar">×</button></header>${palHTML()}`;delete DB.dataset.video;delete DB.dataset.rot;if(!D.open)D.showModal();return}
 if(a=='aAprovar'||a=='aSugerir'){const id=b.dataset.id,it=CANVA.itens.find(x=>x.id==id);db.artes=db.artes||{};const ar=db.artes[id]=db.artes[id]||{s:'aprovacao',c:[]};const t=document.getElementById('ar'+id).value.trim();
  if(a=='aSugerir'&&!t){document.getElementById('ar'+id).focus();toast('Escreva as sugestões');return}
  if(t)ar.c.push({a:'Instituto',t,q:fmt(hoje)});ar.s=a=='aAprovar'?'aprovado':'ajuste';
  notify(a=='aAprovar'?`Arte "${it.t}" aprovada`:`Melhorias sugeridas na arte "${it.t}"`);save();render();toast(a=='aAprovar'?'Arte aprovada!':'Sugestões enviadas');return}
 if(a=='desconectar'){db.drive.conectado=false;save();render();toast('Drive desconectado')}
 if(a=='virar'){const arq=db.drive.entrada.find(x=>x.id==b.dataset.id);form('v');document.getElementById('nT').value=arq.nome.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ');document.getElementById('nD').value='https://drive.google.com/';DB.dataset.arq=arq.id;return}
 if(a=='dAprovar'||a=='dSugerir'){const v=db.videos.find(x=>x.id==b.dataset.id);const t=document.getElementById('sg'+v.id).value.trim();
  if(a=='dSugerir'&&!t){document.getElementById('sg'+v.id).focus();toast('Escreva as sugestões');return}
  if(t)v.coments.push({a:'Instituto',t,q:fmt(hoje)});
  v.status=a=='dAprovar'?'aprovado':'ajuste';notify(a=='dAprovar'?`${db.cfg.nome} aprovou "${v.titulo}" pelo Drive`:`Melhorias sugeridas em "${v.titulo}"`);
  save();render();toast(a=='dAprovar'?'Vídeo aprovado!':'Sugestões enviadas ao editor');return}
 if(a=='fechar')D.close();
 if(a=='novo')form('v');
 if(a=='novoRot')form('r');
 if(a=='reset'){db=seed();save();render();toast('Dados de exemplo restaurados')}
 if(a=='notifs'){DB.innerHTML=`<header><h2>Avisos</h2><button class="x" data-act="fechar" aria-label="Fechar">×</button></header>${db.notif.map(n=>`<div class="com"><small>${esc(n.q)}</small>${esc(n.t)}</div>`).join('')||'<p class="sub">Sem avisos.</p>'}<button class="btn alt" style="margin-top:12px" data-act="limpar">Marcar todos como lidos</button>`;delete DB.dataset.video;delete DB.dataset.rot;if(!D.open)D.showModal()}
 if(a=='limpar'){db.notif=[];save();render();D.close()}
});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id=='fCom'){const t=document.getElementById('tCom').value.trim();if(!t)return;const v=db.videos.find(x=>x.id==DB.dataset.video);v.coments.push({a:papel=='inst'?'Instituto':'Editor',t,q:fmt(hoje)});save();abrirVideo(v.id);toast('Comentário enviado')}
 if(f.id=='fNovo'){const id=Math.max(0,...db.videos.map(v=>v.id))+1;const p=document.getElementById('nP').value;
  const d=new Date((p||'2026-12-01')+'T12:00');d.setDate(d.getDate()-2);
  db.videos.unshift({id,titulo:document.getElementById('nT').value.trim(),tipo:document.getElementById('nF').value,status:'recebido',prazo:d.toISOString().slice(0,10),post:p,drive:document.getElementById('nD').value||'https://drive.google.com/',versao:0,coments:document.getElementById('nO').value.trim()?[{a:'Instituto',t:document.getElementById('nO').value.trim(),q:fmt(hoje)}]:[],cor:id});
  if(DB.dataset.arq){const arq=db.drive.entrada.find(x=>x.id==DB.dataset.arq);if(arq)arq.pedido=id;delete DB.dataset.arq}
  notify('Novo material recebido: '+db.videos[0].titulo);save();D.close();location.hash='videos';render();toast('Material enviado! O editor foi avisado.')}
 if(f.id=='fRot'){const id=Math.max(0,...db.roteiros.map(r=>r.id))+1;db.roteiros.unshift({id,titulo:document.getElementById('rT').value.trim(),formato:document.getElementById('rF').value,objetivo:document.getElementById('rO').value.trim()||'—',status:'briefing',data:document.getElementById('rD').value,texto:''});
  notify('Novo pedido de roteiro: '+db.roteiros[0].titulo);save();D.close();location.hash='roteiros';render();toast('Briefing enviado!')}
 if(f.id=='fDrive'){db.drive.conectado=true;db.drive.conta=document.getElementById('dEmail').value.trim();save();render();toast('Drive conectado!')}
 if(f.id=='cfg'){db.cfg.nome=document.getElementById('cNome').value.trim()||'Instituto Perfil 40+';db.cfg.whats=document.getElementById('cWa').value.replace(/\D/g,'');save();render();toast('Ajustes salvos')}
});
D.addEventListener('click',e=>{if(e.target===D)D.close()});
D.addEventListener('close',()=>{delete DB.dataset.arq});
document.addEventListener('change',e=>{if(e.target.id!='up')return;const fs=[...e.target.files];if(!fs.length)return;
 let id=Math.max(0,...db.drive.entrada.map(a=>a.id));
 fs.forEach(f=>db.drive.entrada.unshift({id:++id,nome:f.name,tam:f.size>1048576?Math.round(f.size/1048576)+' MB':Math.max(1,Math.round(f.size/1024))+' KB',q:fmt(hoje),por:papel=='inst'?db.cfg.nome:'Editor',pedido:0}));
 notify(fs.length+' arquivo(s) novo(s) na pasta Entrada');save();render();toast('Arquivos enviados para a pasta Entrada')});
window.addEventListener('hashchange',render);
render();
}
</script>
<script>if("serviceWorker"in navigator&&location.protocol=="https:"&&!location.hostname.endsWith("claude.ai")){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}</script>
</body>
