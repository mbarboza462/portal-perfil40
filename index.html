<!DOCTYPE html>
<html lang="pt-BR" data-pal="nude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7d3326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Portal Perfil 40+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: acolhedor e elegante, de mulher para mulher
   IDEA: um caderno de produção do Instituto Perfil 40+, com etapas que ela acompanha
   PICTURE: a esteira de produção e o painel do Instagram no topo
   COLOUR and TYPE: creme, vinho, dourado e rosa suave; Cormorant Garamond + Great Vibes + Inter
   LAYOUT: barra lateral vinho no computador, abas embaixo no celular */
:root{color-scheme:light dark;
--bg:light-dark(#faf5ec,#1a1013);--card:light-dark(#fffdf9,#251719);--ink:light-dark(#2b1a1e,#f4e9e3);
--mute:light-dark(#7a6468,#bda8aa);--line:light-dark(#ecdfcf,#3b272b);--brand:light-dark(#7a1f3d,#e7a3b5);
--brand2:light-dark(#f6e4e6,#3a2029);--acc:light-dark(#9c7128,#d9b26a);--accs:light-dark(#f6ecd8,#3a2d18);--onbrand:light-dark(#fff,#1a1013);--side:#6e1b37;--gold:#e6c27a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,4.6vw,44px)}h2{font-size:25px}h3{font-size:19px}
.cur{font-family:"Great Vibes",cursive;font-weight:400;color:var(--acc);font-size:1.15em}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--onbrand);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;margin:0 8px 22px}
.logo b{font-family:"Cormorant Garamond",serif;font-size:21px;line-height:1.1}.logo small{display:block;font-family:"Great Vibes",cursive;font-size:19px;color:var(--gold)}
.nav a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;min-height:44px}
.nav a[aria-current]{background:color-mix(in srgb,currentColor 14%,transparent)}
.nav svg{width:20px;height:20px;flex:none}
.side .who{margin-top:auto;font-size:13px;opacity:.85;padding:0 8px}
main{padding:clamp(20px,3vw,40px) max(4vw,16px) 100px;max-width:1180px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.sub{color:var(--mute);margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;background:var(--brand);color:var(--onbrand)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.hot{background:var(--acc);color:light-dark(#fff,#1a1013)}
.btn.wa{background:#1fa855;color:#fff}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;min-height:38px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--brand2);color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px 0 24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font:700 clamp(30px,4.4vw,40px)/1.05 "Cormorant Garamond",serif}.kpi span{color:var(--mute);font-size:14px}
.belt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stage{background:var(--brand2);border-radius:12px;padding:12px 10px;min-height:150px;position:relative}
.stage h3{font-size:13px;color:var(--brand);margin-bottom:8px;display:flex;justify-content:space-between}
.chip{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px;margin-bottom:6px;line-height:1.3}
.stage.warn{background:var(--accs)}.stage.warn h3{color:var(--acc)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;text-align:left}
.thumb{width:64px;height:64px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.thumb svg{width:22px;height:22px}
.item .t{font-weight:600}.item .m{color:var(--mute);font-size:14px}
.item{flex-wrap:wrap;row-gap:8px}.item>span[style*="flex:1"]{min-width:min(170px,100%)}.item>.tag{margin-left:auto}
.item>span[style*="flex:1"] .m{display:inline}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--brand2);color:var(--brand)}
.tag.aprovacao,.tag.ajuste,.tag.escrito{background:var(--accs);color:var(--acc)}
.tag.publicado,.tag.aprovado{background:var(--brand);color:var(--onbrand)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:500}
.filters button[aria-pressed=true]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
dialog{border:0;border-radius:18px;padding:0;width:min(640px,100% - 24px);max-height:calc(100vh - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(8,20,18,.55)}
.dlg{padding:22px}.dlg header{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}
.x{border:0;background:var(--bg);border-radius:10px;width:44px;height:44px;font-size:22px;flex:none}
.player{aspect-ratio:9/16;max-height:340px;margin:0 auto 14px;border-radius:14px;display:grid;place-items:center;color:#fff;text-align:center;padding:16px;font-size:14px}
.steps{display:flex;gap:4px;margin:10px 0 16px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
.com{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:8px 0;font-size:15px}.com small{color:var(--mute);display:block}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.note{font-size:13px;color:var(--mute);margin-top:28px}
.bell{position:relative}.bell em{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#fff;font-style:normal;font-size:12px;border-radius:999px;padding:1px 6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.week{margin-bottom:20px}.week h3{color:var(--mute);font-size:14px;margin-bottom:8px}
.day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.day b{font:700 26px/1 "Cormorant Garamond",serif;color:var(--brand);text-align:center}.day b small{display:block;font:500 12px Inter;color:var(--mute)}
pre.rot{white-space:pre-wrap;font:15px/1.6 Inter;background:var(--bg);border-radius:12px;padding:14px;margin:0}
:root[data-pal=rose]{--bg:light-dark(#fbf0ef,#1c1114);--card:light-dark(#fffafa,#28181c);--ink:light-dark(#3a1d26,#f6e8e8);--mute:light-dark(#8a6670,#c4a7ad);--line:light-dark(#f0d9da,#40282e);--brand:light-dark(#9b2c52,#f0a8bf);--brand2:light-dark(#fbe1e7,#46232f);--acc:light-dark(#a8744a,#e5b98f);--accs:light-dark(#f8e6d8,#3d2a1d);--side:#8e2549;--gold:#f3cfa6}
:root[data-pal=noite]{color-scheme:dark;--bg:#1b0d13;--card:#26141b;--ink:#f6ece4;--mute:#c4aab0;--line:#3d232c;--brand:#e3b766;--brand2:#3a1f28;--acc:#e3b766;--accs:#3d2e17;--onbrand:#1b0d13;--side:#12080c;--gold:#e3b766}
:root[data-pal=nude]{--bg:light-dark(#f5ede4,#1b1310);--card:light-dark(#fffaf4,#271c17);--ink:light-dark(#3b2620,#f2e6dc);--mute:light-dark(#86706a,#bfaa9f);--line:light-dark(#e6d6c6,#3d2c24);--brand:light-dark(#8a3b2e,#eba48f);--brand2:light-dark(#f2dfd3,#40261e);--acc:light-dark(#9a6a2c,#dcb06b);--accs:light-dark(#f2e4cc,#3b2c17);--side:#7d3326;--gold:#ecc58a}
:root[data-pal=branco]{--bg:light-dark(#ffffff,#141012);--card:light-dark(#fcf8f6,#1f191b);--ink:light-dark(#231417,#f3ecea);--mute:light-dark(#72636a,#b3a6aa);--line:light-dark(#efe5e2,#33292c);--brand:light-dark(#6e1b37,#e7a3b5);--brand2:light-dark(#f8ecee,#33212a);--acc:light-dark(#b08a3e,#dcb86e);--accs:light-dark(#f7efdf,#382d19);--side:light-dark(#fcf8f6,#1f191b);--gold:#b08a3e;--sideink:light-dark(#3b2026,#f3ecea)}
.side{color:var(--sideink,#fff)}
.palbtn{position:fixed;right:16px;bottom:16px;z-index:6;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;box-shadow:0 6px 20px rgba(40,10,20,.18);display:flex;gap:8px;align-items:center}
.palbtn i{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--side) 0 33%,var(--acc) 0 66%,var(--brand2) 0)}
.pals{display:grid;gap:10px}.pal{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px;text-align:left;width:100%}
.pal[aria-pressed=true]{border-color:var(--acc)}.pal .sw{display:flex;height:48px;border-radius:9px;overflow:hidden}.pal .sw span{flex:1}
.pal b{font-family:"Cormorant Garamond",serif;font-size:21px;display:block;line-height:1.1}.pal small{color:var(--mute);font-size:14px}
@media(max-width:700px){.palbtn{bottom:86px}}
details.card>summary{cursor:pointer;font:700 22px/1.2 "Cormorant Garamond",serif;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px}
details.card>summary::-webkit-details-marker{display:none}details.card>summary::after{content:'+';font:600 24px Inter;color:var(--mute)}details.card[open]>summary::after{content:'–'}
.ms{display:flex;gap:3px;margin-top:6px;max-width:220px}.ms i{flex:1;height:5px;border-radius:3px;background:var(--line)}.ms i.on{background:var(--brand)}
.slots{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;min-height:84px}
.slot b.d{font:700 26px/1 "Cormorant Garamond",serif;color:var(--brand);text-align:center}.slot b.d small{display:block;font:500 12px Inter;color:var(--mute)}
.slot.free{border-style:dashed;background:transparent}.slot.free b.d{color:var(--mute)}.slot.extra{border-color:var(--acc)}.slot.over{border-color:#c0392b}
.fat{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}.fat th,.fat td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}.fat th{font-size:13px;color:var(--mute);font-weight:600}.fat td:nth-child(n+2),.fat th:nth-child(n+2){text-align:right;white-space:nowrap}.fat td small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}.fat tfoot td{font-weight:700;font-size:17px;border-bottom:0;padding-top:14px}
.recibo{background:#fff;color:#2b1d17;border:1px solid var(--line);border-radius:12px;padding:22px}.recibo h3{font-family:inherit;margin:0}.recibo .rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--brand);padding-bottom:12px;margin-bottom:12px}.recibo .rm{color:#6b5a52;font-size:13.5px;line-height:1.5}
@media print{body>*:not(#dlg){display:none!important}body{background:#fff!important;min-height:0!important}body *{visibility:hidden!important}#dlg,#dlg *{visibility:visible!important}#dlg{position:absolute;left:0;top:0;width:100%;max-width:none;margin:0;border:0;box-shadow:none;background:#fff}#dlg::backdrop{display:none}.noprint{display:none!important}.recibo{border:0;padding:0}}
.plan{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 16px}
.plan .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.ba{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}.ba h3{font-size:16px;margin-bottom:6px;color:var(--mute)}
.ba .new pre.rot{background:var(--brand2)}
.err{color:#c0392b;font-size:14px;margin-top:6px}
.refs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.refimg{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;background:var(--brand2)}
.refph{width:100%;aspect-ratio:4/5;border-radius:12px;display:grid;place-items:center;text-align:center;color:#fff;padding:14px;font-weight:600}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.del{background:var(--card);color:#b3261e;border:1px solid #e3b1ac}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px 9px;margin-bottom:7px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 6px;cursor:grab;user-select:none}
.kcard .kh{grid-row:span 3;display:grid;place-items:start center;color:var(--mute);font-size:18px;line-height:1;touch-action:none;cursor:grab;padding-top:2px}
.kcard .kt{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:13px;line-height:1.3;color:var(--ink);cursor:pointer}
.kcard .km{font-size:12px;color:var(--mute)}.kcard .btn.sm{min-height:32px;padding:4px 10px;font-size:12px;justify-self:start;margin-top:4px}
.stage{transition:outline-color .15s}.stage.over{outline:2px dashed var(--acc);outline-offset:2px}
.stage .kempty{font-size:12px;color:var(--mute);text-align:center;padding:10px 4px;border:1px dashed var(--line);border-radius:9px}
.kghost{position:fixed;z-index:30;pointer-events:none;opacity:.92;transform:rotate(2deg);box-shadow:0 10px 28px rgba(40,10,20,.25)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.fotos label{margin:0;position:relative;font-weight:500;font-size:12px}.fotos label input{position:absolute;top:4px;left:4px;width:18px;height:18px}
.thumb.vid,.player.vid{background-color:#000;background-position:center;background-size:cover;position:relative}
.thumb.vid::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-35%,-50%);border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent rgba(255,255,255,.92);filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.player.vid .play{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.player.vid .play::after{content:'';border-style:solid;border-width:13px 0 13px 22px;border-color:transparent transparent transparent #fff;margin-left:6px}
@media(max-width:860px){.belt{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
 .logo,.side .who{display:none}.nav{display:flex;width:100%;justify-content:space-around}
 .nav{overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
 .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1 0 64px;text-align:center;align-items:center}
 .belt{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{min-height:auto}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="logo"><svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="19.5" fill="none" stroke="var(--gold)" stroke-width="1.2"/><path d="M12 30c2-6 5-8 9-8s7 2 9 8M21 21a5 5 0 1 0 0-10a5 5 0 0 0 0 10" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M30 10c-3 1-4 4-3 6 2-1 3-3 3-6z" fill="none" stroke="var(--gold)"/></svg><div><b id="instNome">Instituto</b><small>A mulher que escolhe ser</small></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="who" id="who"></div>
 </aside>
 <main id="main"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<button class="palbtn" data-act="cores" aria-label="Escolher cores"><i></i>Cores</button>
<div class="toast" id="toast" role="status"></div>
<script>
{
const ic={
painel:'<path d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-5H4zm10-11h6V4h-6z" fill="currentColor"/>',
videos:'<path d="M4 6h11v12H4zm12 4l4-3v10l-4-3z" fill="currentColor"/>',
roteiros:'<path d="M6 3h9l4 4v14H6zm3 7h7v2H9zm0 4h7v2H9z" fill="currentColor"/>',
calendario:'<path d="M5 6h14v14H5zm0 4h14M9 3v5m6-5v5" stroke="currentColor" stroke-width="2" fill="none"/>',
drive:'<path d="M8 3h8l6 11-4 7H6l-4-7z M8 3l6 11H2 M16 3l-6 11 4 7 M22 14H10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/>',
marca:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15.5 15H18a3 3 0 0 0 3-3c0-5-4-9-9-9z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.5" cy="11" r="1.3" fill="currentColor"/><circle cx="11" cy="7.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/>',
refs:'<path d="M7 3h10v18l-5-4-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 7.5l1.1 2.2 2.4.3-1.8 1.6.5 2.4-2.2-1.2-2.2 1.2.5-2.4-1.8-1.6 2.4-.3z" fill="currentColor"/>',
ajustes:'<circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8l3 3M5 19l3-3m8-8l3-3" stroke="currentColor" stroke-width="2"/>'};
const views=[['painel','Painel'],['videos','Vídeos'],['drive','Drive'],['roteiros','Roteiros'],['calendario','Agenda'],['marca','Artes'],['refs','Referências'],['ajustes','Ajustes']];

   const rm=[...document.querySelectorAll('.rmFoto:checked')].map(c=>+c.value);o.fotos=(o.fotos||[]).filter((x,i)=>!rm.includes(i));
   const nf=[...g('eI').files].slice(0,Math.max(0,6-o.fotos.length));
   if(nf.length){Promise.all(nf.map(thumbOf)).then(ims=>{nf.forEach((f,i)=>{if(ims[i])o.fotos.push({nome:f.name,img:ims[i]})});notify('Editado: '+o.titulo);save();D.close();render();toast('Alterações salvas')});return}}
  if(k=='r'){const nt=g('eX').value.trim();if(nt!==o.original&&o.status!='enviado'){o.status='enviado';o.melhorado='';o.notas=''}
   o.original=nt;o.titulo=g('eT').value.trim();o.formato=g('eF').value;o.objetivo=g('eO').value.trim();o.data=g('eP').value}
  const fim=()=>{notify('Editado: '+(o.titulo||o.nome));save();D.close();render();toast('Alterações salvas')};
  if(k=='ref'){o.titulo=g('eT').value.trim();o.link=g('eL').value.trim();o.gostou=g('eG').value.trim();const fa=g('eA').files[0];
   if(fa){thumbOf(fa).then(img=>{o.img=img||'';o.arq=fa.name;fim()});return}
   if(o.link&&!o.arq&&(!o.img||g('eL').defaultValue!==o.link)){linkThumb(o.link).then(img=>{if(img)o.img=img;fim()});return}}
  fim()}
 if(f.id=='cfg'){db.cfg.nome=document.getElementById('cNome').value.trim()||'Instituto Perfil 40+';db.cfg.whats=document.getElementById('cWa').value.replace(/\D/g,'');save();render();toast('Ajustes salvos')}
});
D.addEventListener('click',e=>{if(e.target===D)D.close()});
D.addEventListener('close',()=>{delete DB.dataset.arq});
const linkThumb=async url=>{if(!url)return'';const y=url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);if(y)return`https://img.youtube.com/vi/${y[1]}/hqdefault.jpg`;
 try{const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(url)).then(x=>x.json());return(r&&r.data&&r.data.image&&r.data.image.url)||''}catch(e){return''}};
const thumbOf=f=>new Promise(res=>{if(!f)return res('');try{const u=URL.createObjectURL(f);const cv=document.createElement('canvas');
 const draw=(el,w,h)=>{const s=Math.min(1,360/Math.max(w,h));cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext('2d').drawImage(el,0,0,cv.width,cv.height);let d='';try{d=cv.toDataURL('image/jpeg',.7)}catch(x){}URL.revokeObjectURL(u);res(d)};
 if(/^image\//.test(f.type)){const im=new Image();im.onload=()=>draw(im,im.naturalWidth,im.naturalHeight);im.onerror=()=>res('');im.src=u}
 else if(/^video\//.test(f.type)){const v=document.createElement('video');v.muted=true;v.preload='auto';v.onloadeddata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2)};v.onseeked=()=>draw(v,v.videoWidth,v.videoHeight);v.onerror=()=>res('');setTimeout(()=>res(''),8000);v.src=u}
 else res('')}catch(x){res('')}});
document.addEventListener('change',async e=>{
 if(e.target.id=='aI'||e.target.id=='eI'){const box=document.getElementById(e.target.id=='aI'?'aPrev':'ePrev'),fs=[...e.target.files].slice(0,6);
  box.innerHTML='';for(const f of fs){const t=await thumbOf(f);if(t)box.insertAdjacentHTML('beforeend',`<img src="${t}" alt="${esc(f.name)}">`)}
  if(e.target.files.length>6)toast('Só as 6 primeiras imagens serão enviadas');return}
 if(e.target.id=='nFile'){const f=e.target.files[0],fm=document.getElementById('fNovo'),info=document.getElementById('nFileInfo'),er=document.getElementById('nErr');delete fm.dataset.bad;delete fm.dataset.dur;er.hidden=true;if(!f)return;
  info.textContent='Conferindo a duração…';const d=await dur(f);
  if(d>90){fm.dataset.bad=1;e.target.value='';info.textContent='';er.hidden=false;er.textContent=`Este vídeo tem ${mmss(d)}. O limite é 1min30.`;return}
  if(d)fm.dataset.dur=mmss(d);info.textContent=d?`${f.name} · ${mmss(d)} · dentro do limite`:`${f.name} selecionado`;return}
 if(e.target.id!='up')return;const fs=[...e.target.files];if(!fs.length)return;
 const ok=[],longos=[];for(const f of fs){const d=await dur(f);if(d>90)longos.push(f.name+' ('+mmss(d)+')');else ok.push([f,d])}
 const er=document.getElementById('upErr');
 let id=Math.max(0,...db.drive.entrada.map(a=>a.id));
 const thumbs=await Promise.all(ok.map(([f])=>thumbOf(f)));
 ok.forEach(([f,d],i)=>db.drive.entrada.unshift({id:++id,thumb:thumbs[i]||'',nome:f.name,tam:(f.size>1048576?Math.round(f.size/1048576)+' MB':Math.max(1,Math.round(f.size/1024))+' KB')+(d?' · '+mmss(d):''),q:fmt(hoje),por:papel=='inst'?db.cfg.nome:'Editor',pedido:0}));
 if(ok.length){notify(ok.length+' arquivo(s) novo(s) na pasta Entrada');save();render()}
 if(longos.length){const er2=document.getElementById('upErr');if(er2){er2.hidden=false;er2.textContent='Não enviados (passam de 1min30): '+longos.join(', ')}toast('Vídeos acima de 1min30 não foram enviados')}
 else toast('Arquivos enviados para a pasta Entrada')});
window.addEventListener('hashchange',render);
render();
}
</script>
<script>if("serviceWorker"in navigator&&location.protocol=="https:"&&!location.hostname.endsWith("claude.ai")){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}</script>
